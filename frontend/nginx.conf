# Repris du gabarit de la plateforme (core-platform/templates/nginx.conf), avec la
# Content-Security-Policy adaptée : les adresses localhost:8501/9000 du gabarit ne sont
# joignables ni depuis l'extérieur ni depuis le navigateur d'un visiteur (cf. /CLAUDE.md
# racine du serveur), et script-src est ajouté pour les scripts inline de Next.js (hydration).
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  # Contrôles de santé : fichiers statiques out/health et out/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
    try_files $uri =404;
  }

  # Bundles hashés : immuables, cache long.
  location /_next/static/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html : jamais caché, sinon un onglet ouvert recharge un ancien bundle après déploiement.
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Export statique Next.js : repli des routes profondes vers index.html.
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
